system:
  mode: "paper"                  # "paper" or "live"
  poll_interval_seconds: 60      # Loop interval for analysis & execution
  log_level: "INFO"
  db_path: "storage/apex_trader.db"

trading:
  universe:
    - symbol: "BTC/USDT"
      asset_type: "crypto"
      exchange: "binance"
    - symbol: "ETH/USDT"
      asset_type: "crypto"
      exchange: "binance"
    - symbol: "SOL/USDT"
      asset_type: "crypto"
      exchange: "binance"
    - symbol: "BNB/USDT"
      asset_type: "crypto"
      exchange: "binance"
    - symbol: "NVDA"
      asset_type: "stock"
      exchange: "nasdaq"
    - symbol: "TSLA"
      asset_type: "stock"
      exchange: "nasdaq"
  timeframe: "5m"                # 1m, 5m, 15m, 1h, 1d
  lookback_candles: 100

risk:
  max_portfolio_risk_pct: 1.5    # Max % of portfolio equity risked per trade
  max_open_positions: 3          # Maximum concurrent open trades
  daily_max_drawdown_pct: 3.0    # Circuit breaker: halt trading if daily drawdown >= 3%
  risk_reward_ratio_min: 1.5     # Minimum acceptable Take-Profit / Stop-Loss ratio
  max_slippage_tolerance_pct: 0.2
  atr_multiplier_stop: 1.5       # Volatility-based ATR trailing stop multiplier
  breakeven_trigger_atr: 1.0     # Move stop to breakeven once price moves +1.0 ATR

agents:
  llm_provider: "gemini"         # "gemini", "openai", "anthropic", "ollama"
  model_name: "gemini-flash-latest"
  temperature: 0.2
  debate_rounds: 1               # Number of rounds for Bull vs. Bear debate
  confidence_threshold: 0.75     # Minimum 75% conviction required from Master Strategist to trigger a trade
